name: Windows CMake

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: ${{ matrix.name }}
    # Pinned: the "Visual Studio 17 2022" generator below needs VS 2022, which the
    # rolling windows-latest image no longer ships.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build Game
            target: Game
            build_config: Debug
            o2_editor: OFF
            o2_tests: OFF
            run_ctest: false
          - name: Build Editor
            target: Editor
            build_config: Debug
            o2_editor: ON
            o2_tests: OFF
            run_ctest: false
          - name: Build & Run Tests
            target: o2UtilTests o2SystemTests o2RenderTests o2EditorTests GameTests
            build_config: Debug
            o2_editor: ON
            o2_tests: ON
            run_ctest: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Increase pagefile
      uses: al-cheb/configure-pagefile-action@v1.4
      with:
        minimum-size: 16GB
        maximum-size: 16GB
        disk-root: "D:"

    - name: Set up Visual Studio
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.build_config }} -DO2_TESTS=${{ matrix.o2_tests }} -DO2_EDITOR=${{ matrix.o2_editor }}

    - name: Build with CMake
      run: cmake --build build --config ${{ matrix.build_config }} --parallel --target ${{ matrix.target }}

    # GitHub-hosted Windows VMs only ship with the Microsoft Basic Display
    # Adapter (OpenGL 1.1). Install Mesa3D system-wide so the test exe gets a
    # software-rendered OpenGL 3.3+ context via llvmpipe.
    - name: Install Mesa software OpenGL for tests
      if: matrix.run_ctest
      shell: pwsh
      run: |
        # Pinned to the last release known to carry the desktop OpenGL drivers: the msvc package of 26.2.7 has none
        # ("systemwidedeploy.cmd 1" refuses), and the tests got the runner's OpenGL 1.1 and crashed at start.
        $tag = "26.2.4"
        $file = "mesa3d-$tag-release-msvc.7z"
        $url  = "https://github.com/pal1000/mesa-dist-win/releases/download/$tag/$file"
        Write-Host "Downloading $url"
        Invoke-WebRequest -Uri $url -OutFile $file
        New-Item -ItemType Directory -Force -Path mesa | Out-Null
        7z x $file -omesa -y | Out-Null
        Write-Host "Mesa archive contents:"
        Get-ChildItem -Recurse mesa | Select-Object -First 30 FullName
        $deploy = Get-ChildItem -Recurse mesa -Filter systemwidedeploy.cmd | Select-Object -First 1
        if (-not $deploy) { throw "systemwidedeploy.cmd not found in archive" }
        Push-Location $deploy.Directory.FullName
        # 1 = core desktop OpenGL (llvmpipe). Non-interactive admin-deploy.
        cmd /c "systemwidedeploy.cmd 1"
        Pop-Location

    - name: Run tests
      if: matrix.run_ctest
      env:
        # Mesa would take its D3D12 driver over the runner's Basic Render Driver; the suites are kept to llvmpipe
        GALLIUM_DRIVER: llvmpipe
      # ctest -E excludes two things on this CI runner (locally, on a real GPU, nothing is excluded):
      #  - *_NOT_BUILT: placeholder tests for targets this job intentionally doesn't build
      #    (GameUITests renders the deferred 3D scene, so it stays local/mac-CI only).
      #  - the GPU-dependent render suites (3D / deferred draw, texture copy readback): they don't
      #    work correctly on the runner's software OpenGL (Mesa llvmpipe). They pass on real GPUs
      #    (local runs, macOS CI).
      #  - VectorSpriteRender / VectorSpritePerf (pixel comparison within 1-3 levels, frame timing):
      #    never run on llvmpipe, excluded as a precaution. VectorImageBuild (assets builder for
      #    .svg, no pixels) stays in.
      #  - LayerImageRender / VectorWidgetsRender (raster sibling built into a texture, pixels
      #    of widget drawables): never run on llvmpipe, excluded as a precaution. VectorWidgets
      #    (widget slots, clone, serialization, no pixels) stays in.
      #  - o2EditorUITests/EditorVectorUIParity (the editor frame drawn with raster and with vector
      #    sprites, compared by pixels): needs a real GPU; the target is not built here, the entry
      #    keeps it out if that changes. o2SystemTests/EditorVectorSprites (software rasterizer) stays in.
      #  - RenderGeometryDraw (retained geometry batches, pixels read back) and
      #    o2EditorUITests/EditorVectorUIPerf (frame time of the editor drawn with vector against
      #    raster sprites): pixels and timing of a real GPU, excluded as the suites above.
      #    o2UtilTests/VectorMeshSimplifier (triangle counts, software rasterizer) stays in.
      #  - TextGlyphMeshesRender (a text drawn by glyph meshes against the one drawn from the font
      #    texture, by pixels): never run on llvmpipe, excluded as the suites above.
      #    o2UtilTests/VectorScalableMesh (software rasterizer) stays in.
      #  - SkinnedMeshDraw (GPU skinning against the CPU reference, the deferred pipeline lighting a skinned mesh, pixels
      #    read back): ends silently on llvmpipe after a frame of the animated mesh, excluded as the GPU suites above.
      run: ctest --test-dir build --build-config ${{ matrix.build_config }} --output-on-failure --parallel 4 -E '_NOT_BUILT$|^o2RenderTests/(Render3D|RenderChunkedDraw|Mesh3DDraw|RenderPipelineDraw|TextureCopy|VectorSpriteRender|VectorSpritePerf|LayerImageRender|VectorWidgetsRender|RenderGeometryDraw|TextGlyphMeshesRender|SkinnedMeshDraw)$|^o2EditorUITests/(EditorVectorUIParity|EditorVectorUIPerf)$'

    # A suite that ends without a word (an exit code, no exception) is run again on its own: its exit code in hex and,
    # under cdb when the runner has it, the stack where it stopped.
    - name: Crashed suites, once more
      if: failure() && matrix.run_ctest
      shell: pwsh
      env:
        GALLIUM_DRIVER: llvmpipe
      run: |
        $failed = Get-Content build/Testing/Temporary/LastTestsFailed.log -ErrorAction SilentlyContinue
        $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
        foreach ($line in $failed) {
          $name = ($line -split ':', 2)[1]
          if ($name -notmatch '^([^/]+)/(.+)$') { continue }
          $exe = Get-ChildItem -Recurse -Filter "$($Matches[1]).exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { continue }
          $filter = "--gtest_filter=$($Matches[2]).*"
          Push-Location $exe.Directory.FullName
          Write-Host "=== $name"
          & $exe.FullName $filter
          Write-Host ("exit code: 0x{0:X8}" -f $LASTEXITCODE)
          if (Test-Path $cdb) { & $cdb -g -lines -y $exe.Directory.FullName -c "kp 60; q" $exe.FullName $filter }
          Pop-Location
        }
